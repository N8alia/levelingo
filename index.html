<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Levelingo</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{ box-sizing:border-box; }

:root{
  --bg:#171426;
  --bg-soft:#211D36;
  --surface:#FBF8F2;
  --ink:#221F2E;
  --muted:#6B6478;
  --line:#E6E0D2;

  --past:#5B7FDE;
  --present:#E8A33D;
  --future:#33B6A8;
  --perfect:#9B6BD6;

  --success:#2FB673;
  --warn:#E8A33D;
  --error:#E1543D;

  --radius-lg:20px;
  --radius-md:14px;
  --radius-sm:10px;

  --font-display:'Space Grotesk', sans-serif;
  --font-mono:'IBM Plex Mono', monospace;
  --font-body:'Inter', sans-serif;
}

body{
  margin:0;
  font-family:var(--font-body);
  background:
    radial-gradient(circle at 15% 0%, var(--bg-soft), transparent 55%),
    var(--bg);
  color:var(--surface);
  padding:20px 14px 60px;
  min-height:100vh;
}

.app{
  max-width:480px;
  margin:0 auto;
  position:relative;
}

.lang-switch{
  position:absolute;
  top:0;
  right:0;
  display:flex;
  gap:4px;
  background:var(--bg-soft);
  padding:4px;
  border-radius:999px;
}
.lang-btn{
  border:0;
  background:transparent;
  color:var(--surface);
  opacity:0.6;
  font-family:var(--font-mono);
  font-size:12px;
  font-weight:600;
  padding:6px 10px;
  border-radius:999px;
  cursor:pointer;
}
.lang-btn.active{
  background:var(--surface);
  color:var(--ink);
  opacity:1;
}

.app-header{
  text-align:center;
  margin-bottom:18px;
}

.logomark{
  display:flex;
  align-items:flex-end;
  justify-content:center;
  gap:5px;
  height:26px;
  margin:0 auto 12px;
}
.lm-dot{
  display:block;
  width:8px;
  border-radius:3px;
  background:var(--c);
}
.lm-dot:nth-child(1){ height:8px; }
.lm-dot:nth-child(2){ height:14px; }
.lm-dot:nth-child(3){ height:20px; }
.lm-dot:nth-child(4){ height:26px; }

.app-title{
  font-family:var(--font-display);
  font-size:38px;
  font-weight:700;
  margin:0;
  letter-spacing:-0.01em;
}
.wm-base{ color:var(--surface); }
.wm-pivot{ color:var(--present); }
.wm-accent{
  color:var(--future);
  background:linear-gradient(90deg,var(--perfect),var(--future));
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
}

.eyebrow{
  font-family:var(--font-mono);
  font-size:12px;
  letter-spacing:0.1em;
  text-transform:uppercase;
  color:rgba(251,248,242,0.6);
  margin:8px 0 0;
}

/* Timeline */
.timeline{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:4px;
  padding:14px 6px;
  margin-bottom:16px;
  background:var(--bg-soft);
  border-radius:var(--radius-lg);
  position:relative;
}
.timeline::before{
  content:"";
  position:absolute;
  left:24px;
  right:24px;
  top:24px;
  height:2px;
  background:linear-gradient(90deg,var(--past),var(--perfect),var(--present),var(--future));
  opacity:0.5;
  z-index:0;
}
.timeline-dot{
  position:relative;
  z-index:1;
  background:none;
  border:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  padding:4px;
  cursor:pointer;
  flex:1;
  min-width:0;
}
.timeline-dot .dot{
  width:14px;
  height:14px;
  border-radius:50%;
  background:var(--dot-color);
  display:block;
  transition:transform 0.15s ease, box-shadow 0.15s ease;
}
.timeline-dot.active .dot{
  transform:scale(1.35);
  box-shadow:0 0 0 4px rgba(255,255,255,0.25);
}
.timeline-dot .dot-label{
  font-family:var(--font-mono);
  font-size:9px;
  color:var(--surface);
  opacity:0.7;
  text-align:center;
  line-height:1.2;
}
.timeline-dot.active .dot-label{
  opacity:1;
  font-weight:600;
}

/* Tabs */
.tabs{
  display:flex;
  gap:6px;
  background:var(--bg-soft);
  padding:5px;
  border-radius:999px;
  margin-bottom:16px;
}
.tab-btn{
  flex:1;
  border:0;
  padding:11px 10px;
  border-radius:999px;
  background:transparent;
  color:var(--surface);
  opacity:0.6;
  font-family:var(--font-body);
  font-weight:600;
  font-size:14px;
  cursor:pointer;
}
.tab-btn.active{
  background:var(--surface);
  color:var(--ink);
  opacity:1;
}

/* Panel */
.panel{
  background:var(--surface);
  color:var(--ink);
  border-radius:var(--radius-lg);
  padding:20px;
  box-shadow:0 20px 40px rgba(0,0,0,0.35);
  text-align:center;
}

.stat-bar{
  display:flex;
  gap:8px;
  margin-bottom:14px;
}
.stat-chip{
  font-family:var(--font-mono);
  font-size:13px;
  font-weight:600;
  background:var(--bg);
  color:var(--surface);
  padding:8px 12px;
  border-radius:var(--radius-sm);
}
.stat-chip--muted{
  background:var(--line);
  color:var(--ink);
}

.controls{
  display:flex;
  flex-direction:column;
  gap:8px;
  margin-bottom:12px;
}

select,
.text-input{
  width:100%;
  padding:13px 14px;
  border-radius:var(--radius-sm);
  border:1.5px solid var(--line);
  font-family:var(--font-body);
  font-size:15px;
  background:white;
  color:var(--ink);
}

select:focus-visible,
.text-input:focus-visible,
.btn:focus-visible,
.timeline-dot:focus-visible,
.tab-btn:focus-visible,
.lang-btn:focus-visible{
  outline:3px solid var(--present);
  outline-offset:2px;
}

.btn{
  display:inline-block;
  width:100%;
  border:0;
  border-radius:var(--radius-sm);
  padding:14px;
  font-family:var(--font-body);
  font-weight:600;
  font-size:15px;
  cursor:pointer;
  margin-bottom:8px;
  transition:transform 0.1s ease;
}
.btn:active{
  transform:scale(0.98);
}
.btn-violet{ background:var(--perfect); color:white; }
.btn-amber{ background:var(--present); color:var(--ink); }

.action-row{
  display:flex;
  gap:8px;
}
.action-row.secondary{
  flex-wrap:wrap;
}
.action-row.secondary .btn{
  flex:1 1 30%;
  font-size:13px;
  padding:11px 6px;
}

.btn-outline{
  background:transparent;
  border:1.5px solid currentColor;
}
.btn-outline--past{ color:var(--past); }
.btn-outline--error{ color:var(--error); }
.btn-outline--future{ color:var(--future); }

.flashcard{
  background:#fff;
  border:1.5px solid var(--line);
  border-top:5px solid var(--muted);
  border-radius:var(--radius-md);
  padding:16px;
  margin:12px 0;
  text-align:left;
}
.flashcard .placeholder{
  margin:0;
  color:var(--muted);
  font-family:var(--font-mono);
  font-size:14px;
  text-align:center;
}
.flash-tags{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-bottom:10px;
}
.chip{
  --chip-color:#9CA3AF;
  font-family:var(--font-mono);
  font-size:11px;
  font-weight:600;
  padding:5px 10px;
  border-radius:999px;
  background:var(--chip-color);
  color:white;
  opacity:0.9;
}
.chip--marker{
  margin:3px 4px 3px 0;
  display:inline-block;
  background:var(--future);
}
.flash-verb{
  margin:0 0 12px;
  font-size:16px;
}
.flash-instruction{
  font-family:var(--font-mono);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:0.06em;
  color:var(--muted);
  margin:0 0 10px;
}
.flash-main{
  display:flex;
  gap:10px;
  margin-bottom:10px;
}
.flash-field{
  flex:1;
  min-width:0;
  background:#F7F5EF;
  border-radius:var(--radius-sm);
  padding:10px 12px;
}
.flash-eyebrow{
  display:block;
  font-family:var(--font-mono);
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:0.06em;
  color:var(--muted);
  margin-bottom:4px;
}
.flash-word{
  font-family:var(--font-display);
  font-size:22px;
  font-weight:700;
  color:var(--ink);
  word-break:break-word;
}
.flash-marker{
  font-size:15px;
  font-weight:600;
  color:var(--ink);
  word-break:break-word;
}
.mono{
  font-family:var(--font-mono);
}
.formula-box{
  background:#FAF6EC;
  border-radius:var(--radius-sm);
  padding:10px 12px;
  display:flex;
  flex-direction:column;
  gap:4px;
}
.formula-label{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:0.08em;
  color:var(--muted);
}
.formula-code{
  font-size:14px;
  font-weight:600;
}
.hint-toggle{
  background:transparent;
  border:1.5px dashed var(--line);
  color:var(--muted);
  font-family:var(--font-mono);
  font-size:12px;
  font-weight:600;
  padding:8px 10px;
  border-radius:var(--radius-sm);
  cursor:pointer;
  width:100%;
  margin-top:4px;
}
.hint-toggle:hover{
  color:var(--ink);
  border-color:var(--muted);
}

.drill-intro{
  font-size:13px;
  color:var(--muted);
  text-align:left;
  margin:0 0 12px;
}
.drill-header{
  display:flex;
  gap:8px;
  margin-bottom:10px;
}
.drill-header select{
  flex:2;
  margin:0;
}
.drill-header .btn{
  flex:1;
  margin-bottom:0;
  width:auto;
}
.drill-phrase{
  font-family:var(--font-mono);
  font-size:14px;
  color:var(--ink);
  margin:0 0 10px;
  text-align:left;
}
.translate-ru-box{
  background:#F7F5EF;
  border-radius:var(--radius-md);
  padding:16px;
  font-size:18px;
  font-weight:600;
  text-align:left;
  margin-bottom:12px;
  color:var(--ink);
  line-height:1.4;
}
.drill-toggles{
  display:flex;
  gap:8px;
  margin-bottom:10px;
}
.drill-toggles .hint-toggle{
  margin:0;
}
.drill-tense-group{
  text-align:left;
  border:1.5px solid var(--line);
  border-left:4px solid var(--row-color, var(--muted));
  border-radius:var(--radius-md);
  padding:12px;
  margin-bottom:12px;
}
.drill-tense-header{
  font-family:var(--font-mono);
  font-size:13px;
  font-weight:700;
  margin:0 0 10px;
  display:flex;
  align-items:center;
  gap:6px;
}
.drill-tense-header .dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--row-color, var(--muted));
  display:inline-block;
  flex-shrink:0;
}
.drill-type-row{
  margin-bottom:8px;
}
.drill-type-row:last-child{
  margin-bottom:0;
}
.drill-cell-row{
  display:flex;
  align-items:center;
  gap:6px;
}
.drill-type-symbol{
  font-family:var(--font-mono);
  font-weight:700;
  width:18px;
  flex-shrink:0;
  text-align:center;
  color:var(--muted);
}
.cell-hint-btn{
  flex-shrink:0;
  width:32px;
  height:32px;
  border-radius:8px;
  border:1.5px solid var(--line);
  background:white;
  font-size:15px;
  cursor:pointer;
  padding:0;
  line-height:1;
  opacity:0.6;
}
.cell-hint-btn:hover{
  border-color:var(--muted);
  opacity:1;
}
.cell-hint-btn.active{
  background:#FEF3C7;
  border-color:var(--present);
  opacity:1;
}
.cell-check-btn:hover{
  border-color:var(--success);
  opacity:1;
}
.cell-check-btn.active{
  background:#EAF9F1;
  border-color:var(--success);
  opacity:1;
}
.cell-formula{
  margin:6px 0 0 24px;
  font-family:var(--font-mono);
  font-size:11px;
  color:var(--muted);
  line-height:1.4;
  display:none;
}
.cell-formula.visible{
  display:block;
}
.drill-cell-input{
  flex:1;
  min-width:0;
  padding:11px 12px;
  font-size:14px;
  border-radius:8px;
  border:1.5px solid var(--line);
  font-family:var(--font-body);
}
.drill-cell-input.correct{ border-color:var(--success); background:#EAF9F1; }
.drill-cell-input.wrong{ border-color:var(--error); background:#FDEEEB; }

.custom-form{
  text-align:left;
  margin:10px 0;
  padding:12px;
  background:#F7F3E8;
  border-radius:var(--radius-md);
}

.result{
  text-align:left;
  margin-top:16px;
  padding:14px 16px;
  border-radius:var(--radius-md);
  border-left:5px solid var(--muted);
  background:#F7F5EF;
  line-height:1.6;
}
.result h3{
  margin-top:0;
}
.result--success{ border-left-color:var(--success); }
.result--warn{ border-left-color:var(--warn); }
.result--error{ border-left-color:var(--error); }
.result--info{ border-left-color:var(--past); }

/* Learning tab */
.tense-title{
  font-family:var(--font-display);
  margin-top:0;
  text-align:left;
}
.info-panel{
  --panel-color:#9CA3AF;
  border-left:4px solid var(--panel-color);
  background:#F7F5EF;
  border-radius:var(--radius-md);
  padding:14px 16px;
  margin-bottom:12px;
  text-align:left;
}
.info-panel h3{
  margin:0 0 8px;
  font-size:14px;
  text-transform:uppercase;
  letter-spacing:0.06em;
  color:var(--muted);
}
.info-panel ul{
  margin:0;
  padding-left:18px;
}
.info-panel li{
  margin-bottom:6px;
}
.scheme-row{
  --row-color:#9CA3AF;
  display:flex;
  gap:10px;
  align-items:flex-start;
  margin-bottom:10px;
}
.scheme-mark{
  font-family:var(--font-mono);
  font-weight:700;
  width:22px;
  height:22px;
  border-radius:6px;
  background:var(--row-color);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}
.marker-list{
  margin:0;
}

@media (prefers-reduced-motion: reduce){
  *{ transition:none !important; animation:none !important; }
}

@media (max-width:380px){
  .app-title{ font-size:28px; }
  .action-row.secondary .btn{ font-size:12px; }
}
</style>
</head>
<body>

<div class="app">

  <div class="lang-switch" role="group" aria-label="Language">
    <button id="langRuBtn" class="lang-btn active" onclick="setLanguage('ru')">RU</button>
    <button id="langEnBtn" class="lang-btn" onclick="setLanguage('en')">EN</button>
  </div>

  <header class="app-header">
    <div class="logomark" aria-hidden="true">
      <span class="lm-dot" style="--c:var(--past)"></span>
      <span class="lm-dot" style="--c:var(--perfect)"></span>
      <span class="lm-dot" style="--c:var(--present)"></span>
      <span class="lm-dot" style="--c:var(--future)"></span>
    </div>
    <h1 class="app-title"><span class="wm-base">Leve</span><span class="wm-pivot">l</span><span class="wm-accent">ingo</span></h1>
    <p class="eyebrow">level up your lingo, one tense at a time</p>
  </header>

  <div class="timeline" id="timelineStrip"></div>

  <nav class="tabs">
    <button id="tabDrillBtn" class="tab-btn active" onclick="switchTab('drill')">Прогон</button>
    <button id="tabTrainingBtn" class="tab-btn" onclick="switchTab('training')">Тренировка</button>
    <button id="tabTranslateBtn" class="tab-btn" onclick="switchTab('translate')">Перевод</button>
    <button id="tabLearningBtn" class="tab-btn" onclick="switchTab('learning')">Теория</button>
  </nav>

  <section class="panel" id="drillSection">

    <p class="drill-intro" id="drillIntro">Впиши это же слово во все времена — сразу видно, чем они отличаются</p>

    <div class="drill-header">
      <select id="drillVerb" onchange="loadDrillWord(this.value)"></select>
      <button id="drillNewBtn" class="btn btn-violet" onclick="newDrillWord()">Новое слово</button>
    </div>

    <p class="drill-phrase" id="drillPhrase"></p>

    <div class="drill-toggles">
      <button type="button" class="hint-toggle" id="drillShowAllBtn" onclick="toggleDrillAnswers()">Показать все ответы</button>
    </div>

    <div id="drillRows"></div>

    <button id="drillCheckAllBtn" class="btn btn-amber" onclick="checkDrill()">Проверить всё</button>

    <div id="drillResult" class="result" style="display:none;"></div>

  </section>

  <section class="panel" id="trainingSection" style="display:none;">

    <div class="controls">
      <select id="time">
        <option value="all" id="timeAllOption">All tenses</option>
        <option>Present Simple</option>
        <option>Present Continuous</option>
        <option>Past Simple</option>
        <option>Past Continuous</option>
        <option>Future Simple</option>
        <option>Present Perfect</option>
        <option>Present Perfect Continuous</option>
      </select>

      <select id="topic">
        <option value="all" id="topicAllOption">All topics</option>
        <option value="relationship" id="topicOption-relationship">relationship</option>
        <option value="travel" id="topicOption-travel">travel</option>
        <option value="daily" id="topicOption-daily">daily</option>
        <option value="learning" id="topicOption-learning">learning</option>
        <option value="sport" id="topicOption-sport">sport</option>
        <option value="food" id="topicOption-food">food</option>
        <option value="work" id="topicOption-work">work</option>
        <option value="hobby" id="topicOption-hobby">hobby</option>
      </select>

      <select id="type">
        <option value="all" id="typeAllOption">All types</option>
        <option value="statement" id="typeStatementOption">Statement</option>
        <option value="negative" id="typeNegativeOption">Negative</option>
        <option value="question" id="typeQuestionOption">Question</option>
      </select>
    </div>

    <button id="newCardBtn" class="btn btn-violet" onclick="newCard()">New card</button>

    <div class="flashcard" id="card">
      <p class="placeholder">Tap New card</p>
    </div>

    <input id="answer" class="text-input" placeholder="Write your sentence">

    <button id="checkBtn" class="btn btn-amber" onclick="check()">Check</button>

    <div class="action-row secondary">
      <button id="progressBtn" class="btn btn-outline btn-outline--past" onclick="showProgress()">Progress</button>
      <button id="repeatBtn" class="btn btn-outline btn-outline--error" onclick="repeatMistakes()">Repeat mistakes</button>
      <button id="addWordBtn" class="btn btn-outline btn-outline--future" onclick="toggleCustomForm()">+ Add word</button>
    </div>

    <div class="custom-form" id="customForm" style="display:none;">
      <select id="customVerb"></select>
      <input id="customPhrase" class="text-input" placeholder="Complement, e.g. in the park">
      <input id="customTopic" class="text-input" placeholder="Topic (optional)">
      <button id="addCardBtn" class="btn btn-violet" onclick="addCustomCard()">Add card</button>
    </div>

    <div id="result" class="result" style="display:none;"></div>

  </section>

  <section class="panel" id="learningSection" style="display:none;">

    <select id="learnTense" onchange="renderLearningInfo()">
      <option>Present Simple</option>
      <option>Present Continuous</option>
      <option>Past Simple</option>
      <option>Past Continuous</option>
      <option>Future Simple</option>
      <option>Present Perfect</option>
      <option>Present Perfect Continuous</option>
    </select>

    <div id="learningContent"></div>

  </section>

  <section class="panel" id="translateSection" style="display:none;">

    <p class="drill-intro" id="translateIntro">Переведи фразу на английский, используя нужное время</p>

    <div class="translate-ru-box" id="translateRu"></div>

    <input id="translateAnswer" class="text-input" placeholder="Напиши перевод на английском">

    <button id="translateCheckBtn" class="btn btn-amber" onclick="checkTranslate()">Проверить</button>
    <button id="translateNextBtn" class="btn btn-outline btn-outline--future" onclick="newTranslateItem()">Следующая фраза</button>

    <div id="translateResult" class="result" style="display:none;"></div>

  </section>

</div>

<script>

// Progress is kept in memory only for this session
// (no localStorage — it isn't available in this environment)
let progress = {
  correct: 0,
  errors: {},
  streak: 0
};

function save(){
  // no-op: progress lives only in memory for this session
}

function updateXP(){
  // XP and level display were removed from the UI; kept as a no-op
  // so existing call sites elsewhere don't need to change.
}

updateXP();

// ===============================
// Tabs
// ===============================

function switchTab(tab){
  document.getElementById("drillSection").style.display = (tab==="drill") ? "block" : "none";

// ===============================
// Timeline (signature element)
// ===============================

const TENSE_GROUP = {
  "Past Simple":"past",
  "Past Continuous":"past",
  "Present Perfect":"perfect",
  "Present Perfect Continuous":"perfect",
  "Present Simple":"present",
  "Present Continuous":"present",
  "Future Simple":"future"
};

const TIMELINE_ORDER = ["Past Simple","Past Continuous","Present Perfect","Present Perfect Continuous","Present Simple","Present Continuous","Future Simple"];

const TIMELINE_LABELS = {
  "Past Simple":"Past",
  "Past Continuous":"Was ~ing",
  "Present Perfect":"Have done",
  "Present Perfect Continuous":"Have been ~ing",
  "Present Simple":"Habit",
  "Present Continuous":"Now",
  "Future Simple":"Will"
};

const GROUP_COLOR_VAR = {past:"--past", present:"--present", future:"--future", perfect:"--perfect"};

function buildTimeline(){
  let container = document.getElementById("timelineStrip");
  container.innerHTML = "";
  TIMELINE_ORDER.forEach(function(tense){
    let group = TENSE_GROUP[tense];
    let dot = document.createElement("button");
    dot.type = "button";
    dot.className = "timeline-dot";
    dot.dataset.tense = tense;
    dot.style.setProperty("--dot-color", "var(" + GROUP_COLOR_VAR[group] + ")");
    dot.onclick = function(){ selectTenseFromTimeline(tense); };
    dot.innerHTML = '<span class="dot"></span><span class="dot-label">' + TIMELINE_LABELS[tense] + '</span>';
    container.appendChild(dot);
  });
}
buildTimeline();

function highlightTimeline(tense){
  document.querySelectorAll(".timeline-dot").forEach(function(el){
    el.classList.toggle("active", el.dataset.tense === tense);
  });
}

function selectTenseFromTimeline(tense){
  document.getElementById("time").value = tense;
  document.getElementById("learnTense").value = tense;
  highlightTimeline(tense);

  let onLearning = document.getElementById("tabLearningBtn").classList.contains("active");
  if(onLearning){
    renderLearningInfo();
  } else {
    newCard();
  }
}

document.getElementById("time").addEventListener("change", function(){
  highlightTimeline(this.value === "all" ? null : this.value);
});
document.getElementById("learnTense").addEventListener("change", function(){
  highlightTimeline(this.value);
});

function renderLearningInfo(){
  let tense = document.getElementById("learnTense").value;
  let info = LEARNING[tense];
  let usage = LEARNING_USAGE[LANG][tense];
  let formula = TENSES[tense].formula;
  let groupColor = "var(" + GROUP_COLOR_VAR[TENSE_GROUP[tense]] + ")";

  highlightTimeline(tense);

  let html =
    '<h2 class="tense-title" style="color:' + groupColor + '">' + tense + '</h2>' +

    '<div class="info-panel" style="--panel-color:' + groupColor + '">' +
      '<h3>' + t("learningWhenUsed") + '</h3>' +
      '<ul>' + usage.map(function(u){ return '<li>' + u + '</li>'; }).join('') + '</ul>' +
    '</div>' +

    '<div class="info-panel" style="--panel-color:var(--present)">' +
      '<h3>' + t("learningScheme") + '</h3>' +
      '<div class="scheme-row" style="--row-color:var(' + TYPE_COLOR_VAR.statement + ')">' +
        '<span class="scheme-mark">+</span>' +
        '<div><span class="mono">' + formula.statement + '</span><br><i>' + info.examples.statement + '</i></div>' +
      '</div>' +
      '<div class="scheme-row" style="--row-color:var(' + TYPE_COLOR_VAR.negative + ')">' +
        '<span class="scheme-mark">–</span>' +
        '<div><span class="mono">' + formula.negative + '</span><br><i>' + info.examples.negative + '</i></div>' +
      '</div>' +
      '<div class="scheme-row" style="--row-color:var(' + TYPE_COLOR_VAR.question + ')">' +
        '<span class="scheme-mark">?</span>' +
        '<div><span class="mono">' + formula.question + '</span><br><i>' + info.examples.question + '</i></div>' +

let translateCurrentItem = null;
let translateAttempts = 0;

function newTranslateItem(){
  let pool = TRANSLATE_ITEMS;
  let idx = Math.floor(Math.random()*pool.length);
  if(pool.length > 1 && translateCurrentItem){
    while(pool[idx].ru === translateCurrentItem.ru){
      idx = Math.floor(Math.random()*pool.length);
    }
  }
  translateCurrentItem = pool[idx];
  translateAttempts = 0;

  document.getElementById("translateRu").textContent = translateCurrentItem.ru;
  document.getElementById("translateAnswer").value = "";
  document.getElementById("translateResult").style.display = "none";
}

function checkTranslate(){
  if(!translateCurrentItem) return;

  let item = translateCurrentItem;
  let answer = normalize(document.getElementById("translateAnswer").value);
  let fixed = fixSpelling(answer);
  let text = fixed.text;

  let combo = {verb:item.verb, phrase:item.phrase, tense:item.tense, type:item.type, marker:item.marker};

  let structureResult = checkStructure(text, combo);
  let markersOk = text.includes(item.marker);
  let articles = checkArticle(text);
  let correct = structureResult.correct && articles.length===0;

  translateAttempts++;

  let usage = LEARNING_USAGE[LANG][item.tense][0];
  let formula = TENSES[item.tense].formula[item.type];
  let markerTip = markersOk ? "" : `<br><br>${t("msgMarkerTip")} <span class="mono">${item.marker}</span>`;

  if(correct){
    translateCurrentItem.solved = true;
    progress.correct += 1;
    save();
    updateXP();

    show(
      t("translateCorrectTitle"),
      `${t("translateUsedTense")}: <b>${item.tense}</b> (${typeLabel(item.type)})<br><br>
       ${usage}<br><br>
       ${t("labelFormula")}: <span class="mono">${formula}</span>${markerTip}`,
      "success",
      "translateResult"
    );
  } else {
    let errorKey = item.tense + "|" + item.type;
    progress.errors[errorKey] = (progress.errors[errorKey]||0)+1;
    save();
    updateXP();

    let extra = "";
    if(translateAttempts >= 2){
      extra = `<br><br>${t("translateGaveUp")}:<br><b>${buildExample(combo)}</b>`;
    }

    show(
      t("translateWrongTitle"),
      `${t("translateTryAgain")}<br><br>
       ${t("labelTense")}: <b>${item.tense}</b> (${typeLabel(item.type)})<br>
       ${t("labelFormula")}: <span class="mono">${formula}</span>${extra}`,
      "error",
      "translateResult"
    );
  }
}

const RULES = {

  "Present Simple":{ form:"v1", negAux:["don't","do not"], negForm:"v1", qAux:["do"], qForm:"v1" },
  "Present Continuous":{ statementAux:["am","i'm"], form:"ing", negAux:["am not","i'm not"], qAux:["am"] },
  "Past Simple":{ form:"v2", negAux:["didn't","did not"], negForm:"v1", qAux:["did"], qForm:"v1" },
  "Past Continuous":{ statementAux:["was"], form:"ing", negAux:["wasn't","was not"], qAux:["was"] },
  "Future Simple":{ statementAux:["will","i'll"], form:"v1", negAux:["won't","will not"], qAux:["will"] },
  "Present Perfect":{ statementAux:["have","i've"], form:"v3", negAux:["haven't","have not"], qAux:["have"] },
  "Present Perfect Continuous":{ statementAux:["have been","i've been"], form:"ing", negAux:["haven't been","have not been"], qAux:["have"] }
};

const nouns={
  friend:"countable", cinema:"countable", movie:"countable", film:"countable",
  book:"countable", letter:"countable", phone:"countable", lake:"countable",
  choir:"countable", mother:"countable", car:"countable", house:"countable",
  ticket:"countable", hotel:"countable", soulmate:"countable",

  music:"uncountable", water:"uncountable", english:"uncountable",
  volleyball:"uncountable", pizza:"uncountable", coffee:"uncountable",
  dinner:"uncountable", furniture:"uncountable"
};

const spelling={
  watchig:"watching",
  sinema:"cinema",
  studing:"studying",
  writting:"writing"
};

let formulaVisible=false;

function toggleFormula(){
  formulaVisible = !formulaVisible;
  let box = document.getElementById("formulaBox");
  let btn = document.getElementById("formulaToggleBtn");
  if(!box || !btn) return;
  box.style.display = formulaVisible ? "flex" : "none";
  btn.textContent = formulaVisible ? t("hideFormula") : t("showFormula");
}

function normalize(text){
  return text
    .toLowerCase()
    .replace(/[.,!?]/g,"")
    .trim();
}

function hasWord(text, word){
  return text.split(" ").includes(word);
}

function hasForm(text, formLabel, verbKey, tense){
  let form = VERBS[verbKey][formLabel];
  let ok = hasWord(text, form);
  if(tense === "Present Perfect Continuous"){
    ok = ok && hasWord(text, "been");
  }
  return ok;
}

function buildCombos(tenseFilter, topicFilter, typeFilter){
  let items = getAllItems();
  let tenses = Object.keys(TENSES).filter(function(t){ return tenseFilter=="all" || t===tenseFilter; });
  let types = TYPES.filter(function(t){ return typeFilter=="all" || t===typeFilter; });
  let combos = [];

  for(let item of items){
    if(topicFilter!=="all" && item.topic!==topicFilter) continue;
    for(let tense of tenses){
      for(let type of types){
        combos.push({verb:item.verb, topic:item.topic, phrase:item.phrase, tense, type});
      }
    }
  }
  return combos;
}

function newCard(){

  let tense = document.getElementById("time").value;
  let topic = document.getElementById("topic").value;
  let type = document.getElementById("type").value;

  let combos = buildCombos(tense, topic, type);

        '<span class="flash-eyebrow">' + t("labelVerb") + '</span>' +

      '<div class="flash-field">' +

// ===============================
// Building the reference (correct) sentence
// ===============================

function buildExample(combo){
  let v = VERBS[combo.verb];
  let phrase = combo.phrase;
  let marker = combo.marker;
  let type = combo.type;
  let sentence = "";

  switch(combo.tense){
    case "Present Simple":
      if(type=="statement") sentence = `I ${v.v1} ${phrase} ${marker}`;
      if(type=="negative") sentence = `I don't ${v.v1} ${phrase} ${marker}`;
      if(type=="question") sentence = `Do I ${v.v1} ${phrase} ${marker}?`;
      break;
    case "Present Continuous":
      if(type=="statement") sentence = `I am ${v.ing} ${phrase} ${marker}`;
      if(type=="negative") sentence = `I am not ${v.ing} ${phrase} ${marker}`;
      if(type=="question") sentence = `Am I ${v.ing} ${phrase} ${marker}?`;
      break;
    case "Past Simple":
      if(type=="statement") sentence = `I ${v.v2} ${phrase} ${marker}`;
      if(type=="negative") sentence = `I didn't ${v.v1} ${phrase} ${marker}`;
      if(type=="question") sentence = `Did I ${v.v1} ${phrase} ${marker}?`;
      break;
    case "Past Continuous":
      if(type=="statement") sentence = `I was ${v.ing} ${phrase} ${marker}`;
      if(type=="negative") sentence = `I wasn't ${v.ing} ${phrase} ${marker}`;
      if(type=="question") sentence = `Was I ${v.ing} ${phrase} ${marker}?`;
      break;
    case "Future Simple":
      if(type=="statement") sentence = `I will ${v.v1} ${phrase} ${marker}`;
      if(type=="negative") sentence = `I won't ${v.v1} ${phrase} ${marker}`;
      if(type=="question") sentence = `Will I ${v.v1} ${phrase} ${marker}?`;
      break;
    case "Present Perfect":
      if(type=="statement") sentence = `I have ${v.v3} ${phrase} ${marker}`;
      if(type=="negative") sentence = `I haven't ${v.v3} ${phrase} ${marker}`;
      if(type=="question") sentence = `Have I ${v.v3} ${phrase} ${marker}?`;
      break;
    case "Present Perfect Continuous":
      if(type=="statement") sentence = `I have been ${v.ing} ${phrase} ${marker}`;
      if(type=="negative") sentence = `I haven't been ${v.ing} ${phrase} ${marker}`;
      if(type=="question") sentence = `Have I been ${v.ing} ${phrase} ${marker}?`;
      break;
  }
  return sentence;
}

// ===============================
// Answer checking
// ===============================

function fixSpelling(text){
  let changes=[];
  for(let mistake in spelling){
    if(text.includes(mistake)){
      text = text.replace(mistake, spelling[mistake]);
      changes.push(mistake+" → "+spelling[mistake]);
    }
  }
  return { text:text, changes:changes };
}

function articleError(word){
  return "'" + word + "' " + t("needArticle");
}

function checkArticle(text){
  let words = text.split(" ");
  let errors=[];

  for(let i=0;i<words.length;i++){
    let word = words[i];
    if(nouns[word]=="countable"){
      let before = words[i-1];
      if(
        before!="a" &&
        before!="an" &&
        before!="the" &&
        before!="my" &&
        before!="this"
      ){
        errors.push(articleError(word));
      }
    }
  }
  return errors;
}

function checkStructure(text, combo){
  let tense = combo.tense;
  let type = combo.type;
  let verbKey = combo.verb;
  let rules = RULES[tense];
  let mistakes = [];
  let correct = false;

  if(type=="statement"){
    let formOk = hasForm(text, rules.form, verbKey, tense);
    let auxOk = rules.statementAux ? rules.statementAux.some(a=>text.includes(a)) : true;

    if(formOk && auxOk){
      correct = true;
    } else if(formOk && !auxOk){
      correct = true;
      mistakes.push(t("needAux") + " (" + rules.statementAux.join("/") + ")");
    } else if(!formOk && rules.form!="v1" && hasWord(text, VERBS[verbKey].v1)){
      correct = true;
      mistakes.push(t("needForm") + " '" + VERBS[verbKey][rules.form] + "' " + t("insteadOf") + " '" + VERBS[verbKey].v1 + "'");
    }
  }

  if(type=="negative"){
    let form = rules.negForm || rules.form;
    let formOk = hasForm(text, form, verbKey, tense);
    let auxOk = rules.negAux.some(a=>text.includes(a));

    if(formOk && auxOk){
      correct = true;
    } else if(formOk){
      correct = true;
      mistakes.push(t("needNegForm") + " " + rules.negAux[0]);
    } else if(auxOk){
      correct = true;
      mistakes.push(t("checkFormAfter") + " " + rules.negAux[0]);
    }
  }

  if(type=="question"){
    let form = rules.qForm || rules.form;
    let formOk = hasForm(text, form, verbKey, tense);
    let auxOk = rules.qAux.some(a=>text.includes(a));
    let startsRight = rules.qAux.some(a=>text.trim().startsWith(a));

    if(formOk && auxOk && startsRight){
      correct = true;
    } else if(formOk && auxOk){
      correct = true;
      mistakes.push(t("questionStartsWith") + " " + rules.qAux[0]);
    } else if(formOk){
      correct = true;
      mistakes.push(t("needQuestionAux") + " " + rules.qAux[0] + " " + t("atTheStart"));
    }
  }

  return { correct:correct, mistakes:mistakes };
}

function checkMarkers(text, combo){
  return text.includes(combo.marker);
}

function show(title,text,kind,targetId){
  kind = kind || "info";
  targetId = targetId || "result";
  let resultEl = document.getElementById(targetId);
  resultEl.className = "result result--" + kind;
  resultEl.style.display = "block";
  resultEl.innerHTML = `<h3>${title}</h3>${text}`;
}

function check(){

  if(!current){
    return;
  }

  let answer = normalize(document.getElementById("answer").value);
  let fixed = fixSpelling(answer);
  let text = fixed.text;

  let structureResult = checkStructure(text, current);
  let markersOk = checkMarkers(text, current);
  let articles = checkArticle(text);
  let errorKey = current.tense + "|" + current.type;

  if(!structureResult.correct){

    progress.errors[errorKey] = (progress.errors[errorKey]||0)+1;

    show(
      t("resultPracticeTitle"),
      `${t("msgCheck")}:<br>
       <b>${current.tense}</b> — ${typeLabel(current.type)}<br><br>
       ${t("msgFormula")}:<br>
       ${TENSES[current.tense].formula[current.type]}<br><br>
       ${t("msgExample")}:<br>
       ${buildExample(current)}`,
      "error"
    );

    progress.streak = 0;

  } else if(articles.length>0){

    show(
      t("resultAlmostTitle"),
      `${t("msgGrammarOk")} ✅<br><br>
       ${t("msgFixThis")}:<br>
       ${articles.join("<br>")}<br><br>
       ${t("msgCorrectly")}:<br>
       <b>${buildExample(current)}</b>`,
      "warn"
    );

    progress.streak++;

  } else if(!markersOk){

    progress.correct++;

    show(
      t("resultCorrectTitle"),
      `${t("msgGreat")}<br><br>
       ${t("labelTense")}: <b>${current.tense}</b> (${typeLabel(current.type)})<br><br>
       ${t("msgMarkerTip")} <span class="mono">${current.marker}</span>`,
      "success"
    );

    progress.streak++;

  } else if(fixed.changes.length || structureResult.mistakes.length){

    show(
      t("resultAlmostTitle"),
      `${t("msgTimeOk")}: ✅ ${current.tense} (${typeLabel(current.type)})<br><br>
       ${t("msgFixes")}:<br>
       ${fixed.changes.join("<br>")}<br>
       ${structureResult.mistakes.join("<br>")}<br><br>
       ${t("msgCorrectVariant")}:<br>
       <b>${buildExample(current)}</b>`,
      "warn"
    );

    progress.streak++;

  } else {

    progress.correct++;

    show(
      t("resultCorrectTitle"),
      `${t("msgGreat")}<br><br>
       ${t("labelTense")}: <b>${current.tense}</b> (${typeLabel(current.type)})`,
      "success"
    );

    progress.streak++;
  }

  save();
  updateXP();
}

// ===============================
// Progress + weak-spot tracking
// ===============================

function showProgress(){
  let text = `${t("progCorrect")}: ${progress.correct}<br>
    ${t("progStreak")}: ${progress.streak}<br><br>
    <b>${t("progWeak")}:</b><br>`;

  let keys = Object.keys(progress.errors);

  if(keys.length==0){
    text += t("progNoErrors");
  } else {
    keys.sort((a,b)=>progress.errors[b]-progress.errors[a]);
    for(let key of keys){
      let parts = key.split("|");
      let tense = parts[0];
      let type = parts[1];
      text += `<br>${tense} (${typeLabel(type)}): ${progress.errors[key]}`;
    }
  }

  show(t("resultProgressTitle"), text, "info");
}

function repeatMistakes(){
  let keys=[];

  for(let key in progress.errors){
    let count = progress.errors[key];
    for(let i=0;i<count;i++){
      keys.push(key);
    }
  }

  if(keys.length==0){
    show(t("resultNoMistakesTitle"), t("progNoMistakesYet"), "info");
    return;
  }

  let chosen = keys[Math.floor(Math.random()*keys.length)];
  let parts = chosen.split("|");

  document.getElementById("time").value = parts[0];
  document.getElementById("type").value = parts[1];

  newCard();
}

function evaluateCell(input){
  let group = input.closest(".drill-tense-group");
  let tense = group.dataset.tense;
  let type = input.dataset.type;

  input.classList.remove("correct","wrong");

  let answer = normalize(input.value);
  let fixed = fixSpelling(answer);
  let text = fixed.text;

  let marker = TENSES[tense].markers[type][0];
  let combo = {verb:drillCurrentItem.verb, topic:drillCurrentItem.topic, phrase:drillCurrentItem.phrase, tense:tense, type:type, marker:marker};

  let structureResult = checkStructure(text, combo);
  let markersOk = text.includes(marker);
  let articles = checkArticle(text);
  let grammarOk = structureResult.correct && articles.length===0;
  let correct = grammarOk;

  input.classList.add(correct ? "correct" : "wrong");

  if(input.dataset.scored !== "1"){
    input.dataset.scored = "1";
    if(correct){
      progress.correct += 1;
    } else {
      let errorKey = tense + "|" + type;
      progress.errors[errorKey] = (progress.errors[errorKey]||0)+1;
    }
  }

  return correct;
}

function checkSingleCell(input){
  if(!drillCurrentItem) return;
  evaluateCell(input);
  save();
  updateXP();
}

function checkDrill(){
  if(!drillCurrentItem) return;

  let inputs = document.querySelectorAll("#drillRows .drill-cell-input");
  let total = inputs.length;
  let correctCount = 0;

  inputs.forEach(function(input){
    if(evaluateCell(input)) correctCount++;
  });

  save();
  updateXP();

  let resultEl = document.getElementById("drillResult");
  resultEl.className = "result " + (correctCount===total ? "result--success" : "result--warn");
  resultEl.style.display = "block";
  resultEl.innerHTML = "<h3>" + t("drillScore") + ": " + correctCount + " / " + total + "</h3>";
}

loadDrillWord(0);
newTranslateItem();

function toggleCustomForm(){
  let el = document.getElementById("customForm");
  el.style.display = (el.style.display === "none") ? "block" : "none";
}

function addCustomCard(){
  let verb = document.getElementById("customVerb").value;
  let phrase = document.getElementById("customPhrase").value.trim();
  let topic = document.getElementById("customTopic").value.trim() || "custom";

  if(!phrase){
    alert(t("alertNeedPhrase"));
    return;
  }

  customItems.push({verb:verb, topic:topic, phrase:phrase});

  let topicSelect = document.getElementById("topic");
  let exists = Array.from(topicSelect.options).some(o=>o.value===topic);
  if(!exists){
    let opt = document.createElement("option");
    opt.value = topic;
    opt.textContent = topic;
    topicSelect.appendChild(opt);
  }

  document.getElementById("customPhrase").value = "";
  document.getElementById("customTopic").value = "";

  populateDrillVerbSelect();

  show(t("resultAddedTitle"), `${t("newCardAdded")}: <b>${VERBS[verb].v1} ${phrase}</b> (${t("topicWord")}: ${topic})`, "info");
}

// Language switching

function applyLanguage(){
  document.getElementById("langRuBtn").classList.toggle("active", LANG==="ru");
  document.getElementById("langEnBtn").classList.toggle("active", LANG==="en");

  document.getElementById("tabDrillBtn").textContent = t("tabDrill");
  document.getElementById("tabTrainingBtn").textContent = t("tabTraining");
  document.getElementById("tabLearningBtn").textContent = t("tabLearning");
  document.getElementById("tabTranslateBtn").textContent = t("tabTranslate");

  document.getElementById("drillIntro").textContent = t("drillIntro");
  document.getElementById("drillNewBtn").textContent = t("drillNewWord");
  document.getElementById("drillCheckAllBtn").textContent = t("drillCheckAll");
  if(drillCurrentItem){
    renderDrillRows();
  }

  document.getElementById("translateIntro").textContent = t("translateIntro");
  document.getElementById("translateAnswer").placeholder = t("translateAnswerPlaceholder");
  document.getElementById("translateCheckBtn").textContent = t("translateCheck");
  document.getElementById("translateNextBtn").textContent = t("translateNext");
  document.getElementById("translateResult").style.display = "none";

  document.getElementById("timeAllOption").textContent = t("allTenses");
  document.getElementById("topicAllOption").textContent = t("allTopics");
  document.getElementById("typeAllOption").textContent = t("allTypes");
  document.getElementById("typeStatementOption").textContent = t("typeStatement");
  document.getElementById("typeNegativeOption").textContent = t("typeNegative");
  document.getElementById("typeQuestionOption").textContent = t("typeQuestion");

  for(let key in TOPIC_LABELS){
    let el = document.getElementById("topicOption-"+key);
    if(el) el.textContent = TOPIC_LABELS[key][LANG];
  }

  document.getElementById("newCardBtn").textContent = t("newCard");
  document.getElementById("checkBtn").textContent = t("check");
  document.getElementById("progressBtn").textContent = t("progress");
  document.getElementById("repeatBtn").textContent = t("repeat");
  document.getElementById("addWordBtn").textContent = t("addWord");
  document.getElementById("addCardBtn").textContent = t("addCardBtn");

  document.getElementById("answer").placeholder = t("answerPlaceholder");
  document.getElementById("customPhrase").placeholder = t("customPhrasePlaceholder");
  document.getElementById("customTopic").placeholder = t("customTopicPlaceholder");

  if(!current){
    document.getElementById("card").innerHTML = '<p class="placeholder">' + t("cardPlaceholder") + '</p>';
  } else {
    let toggleBtn = document.getElementById("formulaToggleBtn");
    if(toggleBtn) toggleBtn.textContent = formulaVisible ? t("hideFormula") : t("showFormula");
    let formulaLabelEl = document.querySelector("#formulaBox .formula-label");
    if(formulaLabelEl) formulaLabelEl.textContent = t("labelFormula");
  }

  document.getElementById("result").style.display = "none";
  document.getElementById("result").innerHTML = "";

  let onLearning = document.getElementById("tabLearningBtn").classList.contains("active");
  if(onLearning){
    renderLearningInfo();
  }
}

function setLanguage(lang){
  LANG = lang;
  applyLanguage();
}

applyLanguage();
